# Every action, run as its consumers run it. Trivy on both architectures of GitHub's hosted
# runners, twice in a row, so that the second run takes what the first one cached.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./trivy
      - uses: ./trivy
      # The database is in place: the scan downloads nothing.
      - name: scan
        run: trivy fs --quiet --scanners vuln --skip-db-update --exit-code 0 .

  # This repository's own pull requests, checked as consumers check theirs; and a title that is
  # not a Conventional Commit, which must fail.
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./conventional-commits
      - id: wrong
        continue-on-error: true
        uses: ./conventional-commits
        with:
          title: not a conventional title
          commits: "false"
      - if: steps.wrong.outcome != 'failure'
        run: |
          echo "::error::a title that is not a Conventional Commit passed"
          exit 1

  # A build without publishing, as a consumer's pull requests run it: the fixture's site, through
  # the pinned MkDocs and techdocs-cli.
  techdocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: build
        uses: ./techdocs
        with:
          source-dir: .github/fixtures/techdocs
          publish: "false"
      - env:
          SITE: ${{ steps.build.outputs.site }}
        run: test -f "$SITE/index.html" && test -f "$SITE/techdocs_metadata.json"

  # The workflows, the reusable ones included (ghcr-cleanup runs only in its callers).
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
